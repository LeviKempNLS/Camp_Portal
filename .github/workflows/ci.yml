name: CI
on: [pull_request, push]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: camp
          POSTGRES_PASSWORD: camp
          POSTGRES_DB: camp_portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U camp -d camp_portal_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://camp:camp@localhost:5432/camp_portal_test?schema=public
      BETTER_AUTH_SECRET: ci-only-synthetic-not-a-real-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
